name: Ensure Issue Labels

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const wanted = [
              { name: 'bug', color: 'd73a4a', description: 'Something is not working' },
              { name: 'feature', color: '0e8a16', description: 'New feature or request' },
              { name: 'code-generation', color: '1d76db', description: 'Related to code generation behavior' },
              { name: 'ui', color: 'fbca04', description: 'Related to user interface or UX' },
            ];

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existingByName = new Map(existing.map((l) => [l.name.toLowerCase(), l]));

            for (const label of wanted) {
              const match = existingByName.get(label.name.toLowerCase());
              if (!match) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Created label: ${label.name}`);
              }
            }
